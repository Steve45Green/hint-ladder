schema_version: "1.1"
name: feedback-web
description: The web-expert gives code feedback on a graded JavaScript lab with two common mistakes planted, naming both and asking questions instead of fixing.
tags: [feedback, experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the web-expert agent. Code feedback please, this is my graded lab 3: load the items from the API and show them as a list; the list is empty or throws.

    async function load() {
      let data;
      fetch('/api/items').then(r => r.json()).then(j => { data = j; });
      document.querySelector('#list').innerHTML =
        data.map(i => `<li>${i.name}</li>`).join('');
    }
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) using data before the fetch has resolved (it is still undefined); and (2) innerHTML built from item names (XSS).
      Fail if either is missing or misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The lab is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the code is given.
      Fail if corrected code for the lab appears.
