schema_version: "1.1"
name: feedback-cpp
description: "The cpp-expert gives feedback on graded cpp work with two common mistakes planted, naming both and asking questions instead of fixing."
tags: [feedback, experts, new-experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the cpp-expert agent. Code feedback please, this is my graded lab 2: add a grade, then drop the failing ones. It prints 0 and sometimes crashes.

    #include <iostream>
    #include <vector>

    void addGrade(std::vector<int> grades, int g) {
        grades.push_back(g);
    }

    void dropFailing(std::vector<int>& grades) {
        for (auto it = grades.begin(); it != grades.end(); ++it) {
            if (*it < 10) {
                grades.erase(it);
            }
        }
    }

    int main() {
        std::vector<int> grades = {12, 8, 7, 15};
        addGrade(grades, 17);
        dropFailing(grades);
        std::cout << grades.size() << "\n";
    }
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) addGrade takes the
      vector by value, so the caller's vector never gets the new grade; and (2) erasing
      inside the iterator loop invalidates `it` (the loop must continue from the iterator
      erase returns), which skips elements and can crash. Fail if either is missing or
      misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The work is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the work is given. Fail
      if corrected code for the lab appears.
