schema_version: "1.1"
name: feedback-java
description: The java-expert gives code feedback on a graded Java lab with two common mistakes planted, naming both and asking questions instead of fixing.
tags: [feedback, experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the java-expert agent. Code feedback please, this is my graded lab 3: it should say "passed" with the percentage when the student typed yes, but it always says failed and the percentage is 0.

    public static String result(String answer, int correct, int total) {
        double pct = correct / total * 100;
        if (answer == "yes") return "passed with " + pct + "%";
        return "failed";
    }
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) comparing the String answer with == instead of equals; and (2) integer division in correct / total, which gives 0 before the multiplication.
      Fail if either is missing or misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The lab is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the code is given.
      Fail if corrected code for the lab appears.
