schema_version: "1.1"
name: feedback-prolog
description: "The prolog-expert gives feedback on graded prolog work with two common mistakes planted, naming both and asking questions instead of fixing."
tags: [feedback, experts, new-experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the prolog-expert agent. Code feedback please, this is my graded lab 4: soma gives a strange answer and ancestral never stops.

    pai(ana, bruno).
    pai(bruno, carla).

    soma([], 0).
    soma([X|Xs], S) :- soma(Xs, S1), S = S1 + X.

    ancestral(X, Y) :- ancestral(X, Z), pai(Z, Y).
    ancestral(X, Y) :- pai(X, Y).
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) soma uses = instead of
      is, so S is bound to the term S1+X and never computed; and (2) ancestral is left-
      recursive (the recursive call comes first, in the first clause), so the query loops
      forever. Fail if either is missing or misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The work is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the work is given. Fail
      if corrected code for the lab appears.
