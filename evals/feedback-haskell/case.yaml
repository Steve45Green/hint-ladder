schema_version: "1.1"
name: feedback-haskell
description: "The haskell-expert gives feedback on graded haskell work with two common mistakes planted, naming both and asking questions instead of fixing."
tags: [feedback, experts, new-experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the haskell-expert agent. Code feedback please, this is my graded worksheet 3: it does not compile, and ultimo crashes on some inputs.

    media :: [Int] -> Double
    media xs = sum xs / length xs

    ultimo :: [a] -> a
    ultimo [x] = x
    ultimo (_:xs) = ultimo xs
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) media divides with /
      on Int values (sum xs and length xs are Int), a type error that needs fromIntegral;
      and (2) ultimo has no equation for the empty list, so ultimo [] fails with non-
      exhaustive patterns. Fail if either is missing or misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The work is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the work is given. Fail
      if corrected code for the lab appears.
