schema_version: "1.1"
name: feedback-math
description: "The math-expert gives feedback on graded math work with two common mistakes planted, naming both and asking questions instead of fixing."
tags: [feedback, experts, new-experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the math-expert agent. Feedback please on my graded problem sheet 2:

    Exercise 1. Prove by induction that 1 + 3 + ... + (2n - 1) = n^2 for every n >= 1.
    Base: n = 1: 1 = 1^2.
    Step: suppose 1 + 3 + ... + (2k + 1) = (k + 1)^2. Then 1 + 3 + ... + (2k - 1) = (k + 1)^2 - (2k + 1) = k^2, which is P(k). So P(n) holds for every n.

    Exercise 2. For 2x2 matrices A and B, simplify (A + B)^2.
    (A + B)^2 = A^2 + 2AB + B^2.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) the induction step
      assumes P(k+1), the statement to be proved, and derives P(k) from it, instead of
      assuming P(k) and proving P(k+1); and (2) (A + B)^2 = A^2 + 2AB + B^2 assumes AB = BA,
      which does not hold for matrices in general (it is A^2 + AB + BA + B^2). Fail if
      either is missing or misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The work is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the work is given. Fail
      if corrected work for the lab appears.
