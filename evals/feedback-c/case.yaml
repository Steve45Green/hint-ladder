schema_version: "1.1"
name: feedback-c
description: The c-expert gives code feedback on a graded C lab with two common mistakes planted, naming both and asking questions instead of fixing.
tags: [feedback, experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the c-expert agent. Code feedback please, this is my graded lab 3: a greeting helper and a number read from the keyboard; it prints garbage or crashes.

    char *greet(const char *name) {
        char buf[16];
        sprintf(buf, "Hi %s", name);
        return buf;
    }

    int main(void) {
        int n;
        scanf("%d", n);
        printf("%s %d\n", greet("Ana"), n);
        return 0;
    }
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) returning a pointer to the local array buf (it no longer exists after the function returns); and (2) scanf given n instead of its address &n.
      Fail if either is missing or misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The lab is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the code is given.
      Fail if corrected code for the lab appears.
