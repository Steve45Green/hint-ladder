schema_version: "1.1"
name: feedback-sql
description: The sql-expert gives code feedback on a graded SQL lab with two common mistakes planted, naming both and asking questions instead of fixing.
tags: [feedback, experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the sql-expert agent. Code feedback please, this is my graded lab 3: every customer with the number of paid orders, including customers with none; customers with no paid orders are missing or show 1.

    SELECT c.Name, COUNT(*) AS PaidOrders
    FROM Customers c
    LEFT JOIN Orders o ON o.CustomerId = c.Id
    WHERE o.Status = 'paid'
    GROUP BY c.Name;
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) the WHERE condition on the outer-joined table turning the LEFT JOIN into an inner join; and (2) COUNT(*) counting 1 for customers with no orders.
      Fail if either is missing or misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The lab is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the code is given.
      Fail if corrected code for the lab appears.
