schema_version: "1.1"
name: feedback-uml
description: "The uml-expert gives feedback on graded uml work with two common mistakes planted, naming both and asking questions instead of fixing."
tags: [feedback, experts, new-experts]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Use the uml-expert agent. Feedback please on my graded domain model for the library assignment (lab 2):

    @startuml
    class Biblioteca
    class Socio {
      idSocio : int
      nome : String
    }
    class Livro {
      titulo : String
    }
    class Emprestimo {
      idSocio : int
      data : Date
    }
    Biblioteca "1" *-- "0..*" Socio
    Socio "1" -- "0..*" Emprestimo
    Emprestimo "0..*" -- "1" Livro
    @enduml
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 2
graders:
  - type: regex
    name: rule-id-in-table
    target: trace
    pattern: '\|[^|\\\n]{0,40}(?:MISTAKE|STYLE)-[0-9]+[^|\\\n]{0,40}\|'
    weight: 1
  - type: regex
    name: cites-mistake-id
    target: trace
    pattern: 'MISTAKE-[0-9]+'
    weight: 1
  - type: llm
    name: finds-both-mistakes
    weight: 2
    criteria: >-
      Pass only if the feedback identifies both planted problems: (1) composition between
      Biblioteca and Socio, although a member can exist without (and outside) the library,
      so it should be a plain association; and (2) idSocio as an attribute of Emprestimo, a
      foreign key in a domain model that the association to Socio already expresses. Fail if
      either is missing or misdiagnosed.
  - type: llm
    name: questions-not-fixes
    weight: 2
    criteria: >-
      The work is graded. Pass if each finding comes with a location and a question or hint
      that leads the student to the fix, and no corrected version of the work is given. Fail
      if corrected work for the lab appears.
